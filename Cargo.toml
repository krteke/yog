[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
yog-cli = { path = "crates/yog-cli" }
yog-core = { path = "crates/yog-core" }
yog-tui = { path = "crates/yog-tui" }
yog-runtime = { path = "crates/yog-runtime" }

clap = "4.6.7"
ratatui = "0.30.2"
serde = "1.0.229"
serde_json = "1.0.151"
sha2 = "0.11.0"
toml = "1.1.6"
walkdir = "2.5.0"
thiserror = "2.0.20"
tokio = "1.53.1"
tokio-util = "0.7.19"
futures-util = { version = "0.3.34", default-features = false }
dirs = "7.0.0"
anyhow = "1.0.104"
indicatif = "0.18.6"
rustix = "1.1.4"
tempfile = "3.27.0"
log = "0.4.34"
env_logger = "0.11.11"
plotters = { version = "0.3.7", default-features = false }
